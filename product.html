<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 상품 목록 리스트 </title>
    <link rel="stylesheet" href="css/product_list.css">
</head>
<body>
<!-- 전체 레이아웃 -->
<div class="container"> 
    <h1> 신상품 목록 </h1>
    <!-- 상품 리스트 -->
    <ul class="prod_list">
        <li> 
            <img src="images/prod1.jpg" alt="인형">
            <!-- 상품 설명 영역 -->
            <div class="caption"> 
                <h2> 상품1 </h2>
                <p> 상품1의 설명 텍스트</p>
                <p> 가격 : 12,345원 </p>
            </div>
        </li>
        <li> 
            <img src="images/prod2.jpg" alt="인형">
            <!-- 상품 설명 영역 -->
            <div class="caption"> 
                <h2> 상품2 </h2>
                <p> 상품2의 설명 텍스트</p>
                <p> 가격 : 23,345원 </p>
            </div>
        </li>
        <li> 
            <img src="images/prod3.jpg" alt="인형">
            <!-- 상품 설명 영역 -->
            <div class="caption"> 
                <h2> 상품3 </h2>
                <p> 상품3의 설명 텍스트</p>
                <p> 가격 : 32,345원 </p>
            </div>
        </li>
    </ul>
</div>
</body>
</html>
