<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 변형 </title> 
    <link rel="stylesheet" href="css/transform.css">
</head>
<body>
    <!-- 이동 변형 -->
    <div class="container"> 
        <!-- x축 이동 -->
        <div class="origin"> 
            <div class="movex"> </div>
        </div>
        <!-- y축 이동 -->
        <div class="origin"> 
            <div class="movey"> </div>
        </div>
        <!-- xy축 이동 -->
        <div class="origin"> 
            <div class="movexy"> </div>
        </div>
</div>
    <div class="container"> 
    <div class="origin" id="rotate1"> 
        <img src="images/Tree.jpg" alt="나무">
    </div>
    <div class="origin" id="rotate2"> 
        <img src="images/Tree.jpg" alt="나무">
    </div>
</div>
    <div class="container"> 
    <div class="origin" id="rotate3"> 
        <img src="images/Tree.jpg" alt="나무">
    </div>
    <div class="origin" id="rotate4"> 
        <img src="images/Tree.jpg" alt="나무">
    </div>
</div>
        <!-- 비틀기 이동 변형 -->
    <div class="container"> 
        <!-- x축 이동 -->
        <div class="origin"> 
            <div class="skewx"> </div>
        </div>
        <!-- y축 이동 -->
        <div class="origin"> 
            <div class="skewy"> </div>
        </div>
        <!-- xy축 이동 -->
        <div class="origin"> 
            <div class="skewxy"> </div>
        </div>

</div>
</body>
</html>
